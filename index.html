<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>灯下 · 一个没有名字的村子</title>
<style>
:root{
  --ink:#070910;
  --ink2:#0e1219;
  --paper:#e8dcc2;
  --gold:#c8a45c;
  --gold-dim:#8a7136;
  --jade:#79c2b4;
  --blood:#c8543f;
  --line:rgba(200,164,92,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(900px 620px at 50% -12%, #2b2418 0%, rgba(20,18,14,0) 60%),
    radial-gradient(700px 500px at 50% 108%, #14201f 0%, rgba(20,18,14,0) 62%),
    linear-gradient(180deg,#0b0d12 0%,#070810 60%,#0a0c11 100%);
  color:var(--paper);
  font-family:"Songti SC","Noto Serif SC","Source Han Serif SC","SimSun",Georgia,serif;
  display:flex;justify-content:center;
  min-height:100%;padding:18px 12px 26px;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  mix-blend-mode:screen;
}
.wrap{width:100%;max-width:800px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:2}

/* 顶栏 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px}
.brand{font-size:19px;letter-spacing:.42em;color:var(--gold);text-shadow:0 0 24px rgba(200,164,92,.45)}
.brand small{display:block;font-size:10.5px;letter-spacing:.22em;color:rgba(232,220,194,.42);margin-top:3px}
.topbtns{display:flex;gap:7px}
.ghost{
  background:rgba(200,164,92,.05);border:1px solid var(--line);color:rgba(232,220,194,.78);
  padding:6px 11px;border-radius:9px;font-family:inherit;font-size:12.5px;letter-spacing:.12em;cursor:pointer;
  transition:.18s;
}
.ghost:hover{background:rgba(200,164,92,.16);color:var(--paper);border-color:rgba(200,164,92,.5)}

/* 状态栏 */
.hud{
  border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(180deg,rgba(232,220,194,.055),rgba(232,220,194,.012));
  padding:11px 14px;display:flex;gap:14px 22px;flex-wrap:wrap;align-items:center;}
.meter{min-width:132px;flex:1 1 132px}
.meter .lab{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:.2em;color:rgba(232,220,194,.55);margin-bottom:6px}
.meter .lab b{font-weight:400;color:rgba(232,220,194,.85);letter-spacing:.06em}
.bar{height:5px;border-radius:4px;background:rgba(232,220,194,.1);overflow:hidden}
.bar i{display:block;height:100%;width:50%;transition:width .5s ease;border-radius:4px}
#hpHud i{background:linear-gradient(90deg,#8d3a2c,#d9704f);box-shadow:0 0 12px rgba(217,112,79,.55)}
#spHud i{background:linear-gradient(90deg,#2f6f68,#7fd0c2);box-shadow:0 0 12px rgba(127,208,194,.5)}
.meter.stat{flex:0 0 auto;min-width:0;text-align:center}
.meter.stat .lab{justify-content:center;gap:8px}
.meter.stat .lab b{color:var(--gold);font-size:15px;letter-spacing:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1 1 100%}
.chip{
  font-size:11.5px;letter-spacing:.1em;padding:3px 9px;border-radius:999px;
  border:1px solid rgba(200,164,92,.3);color:rgba(232,220,194,.8);background:rgba(200,164,92,.07);
}
.chip.empty{border-color:rgba(232,220,194,.12);color:rgba(232,220,194,.28);background:none}

/* 正文卷轴 */
.scroll{
  position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,#101319,#0b0d13 70%);
  box-shadow:0 0 70px rgba(200,164,92,.06),inset 0 0 90px rgba(0,0,0,.6);
  padding:20px 22px 22px;min-height:290px;
}
.scroll::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(360px 260px at 50% 0%,rgba(200,164,92,.13),rgba(0,0,0,0) 70%);
}
.sceneTitle{
  font-size:13px;letter-spacing:.34em;color:var(--gold);opacity:.85;
  padding-bottom:10px;margin-bottom:14px;border-bottom:1px dashed rgba(200,164,92,.2);
}
.sceneTitle::before{content:"〔 "}
.sceneTitle::after{content:" 〕"}
#text{font-size:16.5px;line-height:2.0;letter-spacing:.045em;color:#e3d7bd;white-space:pre-wrap;min-height:170px}
#text p{margin:0 0 1.05em}
#text p.say{color:#f0e6cf}
#text p.sys{color:rgba(127,208,194,.92);font-size:14.5px;letter-spacing:.1em}
#text p.gain{color:var(--gold);font-size:14.5px;letter-spacing:.1em}
.caret{display:inline-block;width:.55em;color:var(--gold);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.hint{position:absolute;right:16px;bottom:10px;font-size:11px;letter-spacing:.14em;color:rgba(232,220,194,.3)}

/* 选项 */
#choices{display:flex;flex-direction:column;gap:9px}
.choice{
  position:relative;text-align:left;font-family:inherit;cursor:pointer;
  background:linear-gradient(90deg,rgba(200,164,92,.09),rgba(200,164,92,.025));
  border:1px solid var(--line);border-radius:12px;
  color:#ebe0c8;padding:13px 16px 13px 40px;font-size:15.5px;letter-spacing:.05em;line-height:1.6;
  transition:.2s;
  animation:rise .35s both;
}
.choice:nth-child(1){animation-delay:.02s}
.choice:nth-child(2){animation-delay:.09s}
.choice:nth-child(3){animation-delay:.16s}
.choice:nth-child(4){animation-delay:.23s}
.choice:nth-child(5){animation-delay:.30s}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.choice::before{
  content:"◦";position:absolute;left:16px;top:12px;color:var(--gold);opacity:.6;font-size:17px;
}
.choice:hover{
  background:linear-gradient(90deg,rgba(200,164,92,.22),rgba(200,164,92,.05));
  border-color:rgba(200,164,92,.6);transform:translateX(4px);
  box-shadow:-3px 0 0 0 var(--gold),0 8px 26px rgba(0,0,0,.4);
}
.choice:hover::before{content:"▸";opacity:1}
.choice .use{display:block;font-size:11.5px;letter-spacing:.14em;color:var(--jade);opacity:.85;margin-top:5px}
.choice.locked{
  cursor:not-allowed;opacity:.42;border-style:dashed;background:rgba(232,220,194,.03);
  filter:grayscale(.5);
}
.choice.locked::before{content:"×";color:rgba(232,220,194,.5)}
.choice.locked:hover{transform:none;box-shadow:none;border-color:var(--line)}
.choice.locked .use{color:rgba(200,164,92,.75)}
.choice.danger:hover{background:linear-gradient(90deg,rgba(200,84,63,.24),rgba(200,84,63,.05));border-color:rgba(200,84,63,.6);box-shadow:-3px 0 0 0 var(--blood),0 8px 26px rgba(0,0,0,.4)}
.foot{display:flex;justify-content:space-between;align-items:center;padding:0 6px 4px;font-size:11.5px;letter-spacing:.14em;color:rgba(232,220,194,.34)}
.foot button{font-size:11.5px;padding:4px 9px}

/* 结局 */
.ending{text-align:center;padding:8px 0 2px;animation:rise .6s both}
.ending .tag{font-size:12px;letter-spacing:.5em;color:var(--jade);opacity:.8}
.ending h2{margin:12px 0 6px;font-size:26px;letter-spacing:.34em;color:var(--gold);font-weight:400;text-shadow:0 0 30px rgba(200,164,92,.4)}
.ending .sub{font-size:12.5px;letter-spacing:.2em;color:rgba(232,220,194,.5);margin-bottom:18px}
.ending .recap{border-top:1px dashed rgba(200,164,92,.2);border-bottom:1px dashed rgba(200,164,92,.2);padding:13px 0;margin:0 auto 18px;max-width:430px;font-size:13.5px;line-height:2;color:rgba(232,220,194,.75);letter-spacing:.05em}
.ending .recap b{color:var(--gold);font-weight:400}

/* 弹窗 */
.modal{
  position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:rgba(4,5,9,.82);backdrop-filter:blur(3px);padding:20px;
}
.modal[hidden]{display:none}
.card{
  width:100%;max-width:470px;max-height:86vh;overflow:auto;
  border:1px solid var(--line);border-radius:16px;padding:22px 22px 20px;
  background:linear-gradient(180deg,#12151d,#0b0d13);box-shadow:0 30px 90px rgba(0,0,0,.7);
  animation:rise .3s both;
}
.card h3{margin:0 0 4px;font-weight:400;font-size:19px;letter-spacing:.3em;color:var(--gold)}
.card .tip{font-size:11.5px;color:rgba(232,220,194,.45);letter-spacing:.1em;margin-bottom:14px}
.card p,.card li{font-size:14px;line-height:1.95;color:#ddd1b7;letter-spacing:.03em}
.card ul{padding-left:1.2em;margin:.4em 0}
.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.row .ghost{flex:1 1 auto;text-align:center;padding:9px 12px}
.slots{display:flex;flex-direction:column;gap:9px}
.slot{
  display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;
  background:linear-gradient(90deg,rgba(200,164,92,.08),rgba(200,164,92,.02));
  font-family:inherit;color:var(--paper);transition:.18s;
}
.slot:hover{border-color:rgba(200,164,92,.6);background:linear-gradient(90deg,rgba(200,164,92,.2),rgba(200,164,92,.04))}
.slot b{font-weight:400;font-size:14.5px;letter-spacing:.16em;color:var(--gold)}
.slot span{font-size:11.5px;color:rgba(232,220,194,.5);letter-spacing:.08em}
.stat-list{font-size:13.5px;line-height:2.05;color:rgba(232,220,194,.8)}
.deadline{font-size:12px;color:var(--blood);letter-spacing:.12em;margin-top:10px}

/* 提示 */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.tst{
  font-size:13px;letter-spacing:.12em;padding:8px 16px;border-radius:999px;
  border:1px solid rgba(200,164,92,.4);background:rgba(12,14,20,.94);color:var(--gold);
  box-shadow:0 10px 30px rgba(0,0,0,.6);animation:tin .3s both;
}
.tst.bad{border-color:rgba(200,84,63,.5);color:#e88a72}
.tst.ok{border-color:rgba(127,208,194,.45);color:var(--jade)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (max-width:600px){
  body{padding:10px 8px 20px}
  .brand{font-size:16px;letter-spacing:.3em}
  .scroll{padding:16px 15px 18px;border-radius:15px}
  #text{font-size:15.5px;line-height:1.95}
  .choice{font-size:14.5px;padding:12px 13px 12px 34px}
  .meter{min-width:104px}
  .hud{gap:10px 16px;padding:10px 12px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand">灯 下<small>一个没有名字的村子</small></div>
    <div class="topbtns">
      <button class="ghost" id="btnSave">存档</button>
      <button class="ghost" id="btnLoad">读档</button>
      <button class="ghost" id="btnStatus">状态</button>
      <button class="ghost" id="btnAbout">说明</button>
    </div>
  </header>

  <section class="hud">
    <div class="meter" id="hpHud"><div class="lab"><span>命 灯</span><b id="hpNum">10/10</b></div><div class="bar"><i style="width:100%"></i></div></div>
    <div class="meter" id="spHud"><div class="lab"><span>心 魂</span><b id="spNum">7/10</b></div><div class="bar"><i style="width:70%"></i></div></div>
    <div class="meter stat"><div class="lab"><span>察</span><b id="insNum">0</b></div></div>
    <div class="chips" id="chips"></div>
  </section>

  <main class="scroll">
    <div class="sceneTitle" id="sceneTitle">序 · 夜行</div>
    <div id="text"></div>
    <div class="hint" id="skipHint" hidden>点击正文可跳过逐字</div>
  </main>

  <nav id="choices"></nav>
  <div class="foot">
    <span id="footLeft">第一盏灯还未点起</span>
    <span><button class="ghost" id="btnRestart">从头开始</button></span>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="card" id="modalCard"></div>
</div>
<div id="toast"></div>

<script>
(function(){
"use strict";

/* ==========================================================
   灯下 · 我的第一个文字游戏
   单文件文字互动游戏 —— 无依赖、纯前端、离线可玩
   ========================================================== */

var HP_MAX = 10, SP_MAX = 10;

var ITEMS = {
  bijian:  {n:"碧简灯",   d:"铜绿斑驳的小灯，灯芯冷得像一节骨头。传说点三次，能照见前世的自己。"},
  tongjing:{n:"青铜小镜", d:"镜面照不清脸，却照得见一栋不存在的屋。照久了，屋里的人会转过头来。"},
  zhen:    {n:"乌木针",   d:"阿箬替你从背上挑出的三根针。针尖发青，还在轻轻震。"},
  banpage: {n:"半页黄纸", d:"村志被撕去的那半页。上面写着你的名字——以及“献”字。"},
  yao:     {n:"当归远志", d:"两味药。嚼下去舌根发麻，能让胸口的火稳一点。"},
  tuo:     {n:"木陀螺（影）", d:"阿箬给你的陀螺影子。很轻，像一个空壳。转起来的时候，灰里会浮出三十年前的那个晚上。"}
};

/* ---------------- 状态 ---------------- */
var freshState = function(){
  return {
    node:"prologue",
    hp:HP_MAX, sp:SP_MAX, ins:0,
    items:{ bijian:true },
    flags:{},
    log:[],
    steps:0,
    endings:{}
  };
};
var P = freshState();

var KEY_SAVE = "dengxia_save_v1";
var KEY_END  = "dengxia_endings_v1";

try{
  var em = localStorage.getItem(KEY_END);
  if(em){ var tmp = JSON.parse(em); if(tmp && typeof tmp === "object") P.endings = tmp; }
}catch(e){}

/* ---------------- DOM ---------------- */
var $ = function(id){ return document.getElementById(id); };
var elTitle = $("sceneTitle"), elText = $("text"), elChoices = $("choices");
var elHp = $("hpHud"), elSp = $("spHud"), elChips = $("chips");
var elHpNum = $("hpNum"), elSpNum = $("spNum"), elInsNum = $("insNum");
var elModal = $("modal"), elModalCard = $("modalCard");
var elFoot = $("footLeft"), elSkip = $("skipHint");

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

/* ---------------- 提示 ---------------- */
function toast(msg, kind){
  var d = document.createElement("div");
  d.className = "tst" + (kind? " "+kind : "");
  d.textContent = msg;
  $("toast").appendChild(d);
  setTimeout(function(){
    d.style.transition="opacity .5s"; d.style.opacity="0";
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 520);
  }, 1900);
}

/* ---------------- 状态栏 ---------------- */
function renderHud(){
  elHpNum.textContent = P.hp + "/" + HP_MAX;
  elSpNum.textContent = P.sp + "/" + SP_MAX;
  elInsNum.textContent = P.ins;
  elHp.querySelector("i").style.width = (clamp(P.hp,0,HP_MAX)/HP_MAX*100)+"%";
  elSp.querySelector("i").style.width = (clamp(P.sp,0,SP_MAX)/SP_MAX*100)+"%";
  var keys = Object.keys(P.items).filter(function(k){ return P.items[k] && ITEMS[k]; });
  if(!keys.length){ elChips.innerHTML = '<span class="chip empty">身上空空如也</span>'; return; }
  elChips.innerHTML = keys.map(function(k){
    return '<span class="chip" title="'+esc(ITEMS[k].d)+'">'+esc(ITEMS[k].n)+'</span>';
  }).join("");
}
function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ---------------- 效果 ---------------- */
function has(item){ return !!P.items[item]; }
function give(item){
  if(P.items[item]) return;
  P.items[item] = true;
  toast("得到：" + (ITEMS[item]? ITEMS[item].n : item));
  renderHud();
}
function take(item){
  if(!P.items[item]) return;
  delete P.items[item];
  toast("失去：" + (ITEMS[item]? ITEMS[item].n : item), "bad");
  renderHud();
}
function applyEffects(e){
  e = e || {};
  if(e.hp){
    P.hp = clamp(P.hp + e.hp, 0, HP_MAX);
    toast((e.hp>0?"命灯 +":"命灯 ") + e.hp, e.hp>0? "ok":"bad");
  }
  if(e.sp){
    P.sp = clamp(P.sp + e.sp, 0, SP_MAX);
    toast((e.sp>0?"心魂 +":"心魂 ") + e.sp, e.sp>0? "ok":"bad");
  }
  if(e.ins){ P.ins += e.ins; toast("察觉 +" + e.ins, "ok"); }
  if(e.give){ (typeof e.give==="string"? [e.give] : e.give).forEach(give); }
  if(e.take){ (typeof e.take==="string"? [e.take] : e.take).forEach(take); }
  if(e.flag){ Object.keys(e.flag).forEach(function(k){ P.flags[k] = e.flag[k]; }); }
  if(e.log){ P.log.push(e.log); }
  renderHud();
}

/* ---------------- 打字机 ---------------- */
var typing = false, fullText = "", timer = null;
function typeOut(html, done){
  elText.innerHTML = "";
  typing = true;
  elSkip.hidden = false;
  var i = 0, chunk = 2;
  var caret = '<span class="caret">▌</span>';
  function step(){
    if(i >= html.length){ finish(); return; }
    i += chunk;
    elText.innerHTML = html.slice(0,i) + caret;
    scrollBottom();
    timer = setTimeout(step, 16);
  }
  function finish(){
    clearTimeout(timer);
    typing = false;
    elSkip.hidden = true;
    elText.innerHTML = html;
    scrollBottom();
    if(done) done();
  }
  timer = setTimeout(step, 40);
  elText.onclick = function(){ if(typing) finish(); };
  return finish;
}
function scrollBottom(){
  try{ window.scrollTo({ top: document.body.scrollHeight, behavior:"smooth" }); }
  catch(e){
    try{ if(typeof window !== "undefined" && window.scrollTo) window.scrollTo(0, document.body.scrollHeight); }catch(e2){}
  }
}
function stopTyping(){
  if(timer) clearTimeout(timer);
  typing = false;
  elSkip.hidden = true;
}
elText.addEventListener("click", function(){ if(typing) stopTyping(); });

/* ---------------- 文本渲染 ---------------- */
function renderBody(body){
  var html;
  if(typeof body === "function") html = body();
  else html = String(body||"");
  html = esc(html);
  // 标记语法
  html = html.replace(/^\s*>>\s?(.*)$/gm, '<p class="sys">$1</p>');
  html = html.replace(/^\s*!!\s?(.*)$/gm, '<p class="gain">$1</p>');
  html = html.replace(/「([^」]*)」/g, '<span style="color:#f5ebd3">「$1」</span>');
  html = html.replace(/^\s*#\s?(.*)$/gm, '<p style="color:rgba(232,220,194,.42);font-size:13.5px;letter-spacing:.16em;text-align:center">· $1 ·</p>');
  html = html.replace(/\n{2,}/g, "\n");
  html = html.replace(/\n/g, "<br>");
  html = html.replace(/<br>(<p class="(?:sys|gain)")/g, "$1");
  html = html.replace(/(<\/p>)<br>/g, "$1");
  return html;
}

/* ---------------- 场景 ---------------- */
function goto(id){
  var node = SCENES[id];
  if(!node){ console.error("missing node", id); toast("此处尚未写成：" + id, "bad"); return; }
  P.node = id;
  P.steps++;
  renderHud();
  if(node.enter) node.enter();

  // 死亡 / 结局分支优先
  // 结局优先：若目标本身是结局节点，就不再改写为灯灭 / 失魂
  if(!node.ending){
    if(P.hp <= 0){ return goto("end_lamp_out"); }
    if(P.sp <= 0){ return goto("end_mad"); }
  }

  elTitle.textContent = (node.title || "灯下").replace(/\{name\}/g, nameOf());
  var html = renderBody(node.text);
  stopTyping();
  elChoices.innerHTML = "";
  elFoot.textContent = footText();
  typeOut(html, function(){ renderChoices(node); });
  return node;
}
function nameOf(){
  if(P.flags.truename) return P.flags.truename;
  if(P.flags.fakename) return P.flags.fakename;
  return "无名";
}
function footText(){
  var bits = [];
  bits.push("第 " + P.steps + " 步");
  if(P.flags.revealed) bits.push("已吐真言 " + P.flags.revealed + " 次");
  if(P.flags.concealed) bits.push("缄口 " + P.flags.concealed + " 次");
  if(Object.keys(P.endings).length) bits.push("已见结局 " + Object.keys(P.endings).length + "/6");
  return bits.join("　·　");
}

function choiceOk(c){
  if(!c.req) return true;
  if(c.req.item && !has(c.req.item)) return false;
  if(c.req.notItem && has(c.req.notItem)) return false;
  if(c.req.ins && P.ins < c.req.ins) return false;
  if(c.req.flag && !P.flags[c.req.flag]) return false;
  if(c.req.notFlag && P.flags[c.req.notFlag]) return false;
  return true;
}
function reqText(c){
  if(!c.req) return "条件不足";
  var need = [];
  if(c.req.item){
    need.push("你还没有「" + (ITEMS[c.req.item] ? ITEMS[c.req.item].n : c.req.item) + "」");
  }
  if(c.req.notItem) need.push("若已失「" + (ITEMS[c.req.notItem] ? ITEMS[c.req.notItem].n : c.req.notItem) + "」，则无从问起");
  if(c.req.ins) need.push("需要察觉 ≥ " + c.req.ins);
  if(c.req.flag) need.push(c.req.flagText || "时机未到");
  if(c.req.notFlag) need.push(c.req.notFlagText || "此路已断");
  return need.join("；") || "条件不足";
}

function renderChoices(node){
  elChoices.innerHTML = "";
  var list = (typeof node.choices === "function") ? node.choices() : (node.choices || []);
  if(!list.length){
    var b = document.createElement("button");
    b.className = "choice";
    b.textContent = "（继续）";
    b.onclick = function(){ goto("prologue"); };
    elChoices.appendChild(b);
    return;
  }
  list.forEach(function(c){
    if(c.hide) return;
    var ok = choiceOk(c);
    var btn = document.createElement("button");
    btn.className = "choice" + (ok? "" : " locked") + (c.danger? " danger" : "");
    if(ok){
      btn.innerHTML = esc(c.text) + (c.use ? '<span class="use">（'+esc(c.use)+'）</span>' : "");
    } else {
      btn.innerHTML = esc(c.text) + '<span class="use">（'+esc(reqText(c))+'）</span>';
    }
    if(ok){
      btn.onclick = function(){
        P.log.push(c.text);
        if(c.act) c.act();
        if(c.to) goto(typeof c.to === "function"? c.to() : c.to);
        else renderChoices(SCENES[P.node]);
      };
    } else {
      btn.onclick = function(){ toast("条件不足。", "bad"); };
    }
    elChoices.appendChild(btn);
  });
}

/* ---------------- 存档 ---------------- */
function saveGame(slot){
  try{
    var data = { t: Date.now(), node:P.node, hp:P.hp, sp:P.sp, ins:P.ins, items:P.items, flags:P.flags, log:P.log.slice(-30), steps:P.steps };
    localStorage.setItem(KEY_SAVE + "_" + slot, JSON.stringify(data));
    return true;
  }catch(e){ return false; }
}
function readSlot(slot){
  try{
    var raw = localStorage.getItem(KEY_SAVE + "_" + slot);
    return raw? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function loadSlot(slot){
  var d = readSlot(slot);
  if(!d){ toast("这个存档是空的。", "bad"); return false; }
  var ends = P.endings;
  P = freshState();
  P.endings = ends;
  P.node = d.node; P.hp = d.hp; P.sp = d.sp; P.ins = d.ins||0;
  P.items = d.items || {}; P.flags = d.flags || {}; P.log = d.log || []; P.steps = d.steps||0;
  closeModal();
  toast("已回到：" + (SCENES[P.node]? (SCENES[P.node].title||"灯下") : "未知处"), "ok");
  goto(P.node);
  return true;
}
function slotInfo(slot){
  var d = readSlot(slot);
  if(!d) return "空";
  var s = SCENES[d.node]? (SCENES[d.node].title||"") : "";
  var dt = new Date(d.t);
  var pad = function(n){ return n<10? "0"+n : ""+n; };
  return s + "　" + dt.getMonth()+1 + "/" + dt.getDate() + " " + pad(dt.getHours()) + ":" + pad(dt.getMinutes());
}

/* ---------------- 弹窗 ---------------- */
function openModal(html){ elModalCard.innerHTML = html; elModal.hidden = false; }
function closeModal(){ elModal.hidden = true; }
elModal.addEventListener("click", function(e){
  if(e.target === elModal) closeModal();
  var act = e.target.getAttribute && e.target.getAttribute("data-act");
  if(!act) return;
  if(act === "close") closeModal();
  if(act === "save"){ var s1=e.target.getAttribute("data-slot"); if(saveGame(s1)){ toast("已存于第 "+s1+" 格","ok"); showSave(); } }
  if(act === "load"){ loadSlot(e.target.getAttribute("data-slot")); }
  if(act === "wipe"){ if(confirm("清空全部存档与结局记录？")){ [1,2,3].forEach(function(i){ localStorage.removeItem(KEY_SAVE+"_"+i); }); localStorage.removeItem(KEY_END); toast("已清空"); closeModal(); } }
});
document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeModal(); });

function showSave(){
  var h = '<h3>存 档</h3><div class="tip">记录停留在当前场景。共三格，可随时覆盖。</div><div class="slots">';

    h += '<button class="slot" data-act="save" data-slot="'+i+'"><b>第 '+i+' 格</b><span>'+esc(slotInfo(i))+'</span></button>';

}
function showLoad(){

/* ---------------- 结局 ---------------- */
function endStep(){
  // 进入结局时不再因灯灭/失魂被强制改写结局
  if(P.hp < 1) P.hp = 1;
  if(P.sp < 1) P.sp = 1;
  renderHud();
}
function markEnd(key){
  P.endings[key] = true;
  try{ localStorage.setItem(KEY_END, JSON.stringify(P.endings)); }catch(e){}
}
function backToStart(){
  var e = P.endings;
  P = freshState();
  P.endings = e;
  return "prologue";
}
function endingScene(id, key, tag, name, recap){
  SCENES[id] = {
    title:"终 · " + name,
    ending:true,
    enter:endStep,
    text:function(){
      markEnd(key);
      return "!!" + tag + "\n\n" + recap;
    },
    choices:[
      { text:"回到破庙，从头再走一遍", to:backToStart },
      { text:"查看我为这一村做的事", to:function(){ showStatus(); return P.node; } }
    ]
  };
}

      : "你把自己的名字，也一并写进了簿子。";
    var head = P.flags.becameKeeper
      ? "笔从你手里落下的时候，你听见屋外第一声鸡叫。那声鸡叫很旧，像是三十年前录下来的。"
      : "你躺进那个凹痕里。石地很凉，很合身，像是量过你的尺寸。";
    return "!!结局 · 留名\n\n"+
    "# 留 名\n\n"+
    head + "\n\n"+
    "灰袍人把铜灯接过去，举在手里看了很久，然后轻轻吹了一口气。\n\n"+
    "灯芯亮了一瞬，就暗了。厅里上千盏灯同时低下去一寸——那是他们在向新来的守灯人弯腰。\n\n"+
    line + "\n\n"+
    "你从祠堂走出来，看着村子里一盏一盏重新亮起的红灯笼，忽然明白了掌柜的为什么天天擦那只空碗——擦碗不是等人的，是让手上有事做。\n\n"+
    "你回到客栈，从柜台下面拿出抹布，坐在掌柜坐过的位子上，开始擦一只空碗。\n\n"+
    "擦到第七遍的时候，门开了，一个提着青灯的人站在门口，浑身是雨。\n\n"+
    "你抬起头。你的眼睛很干净。\n\n"+
    "「客官，」你说，「住店，还是问路？」\n\n"+
    "!!（你成了第三百一十个守灯人。）";
  },
  choices:[
    { text:"回到破庙，从头再走一遍", to:backToStart },
    { text:"查看我为这一村做的事", to:function(){ showStatus(); return P.node; } }
  ]
};

SCENES.end_return = {
  title:"终 · 无 名",
  ending:true,
  enter:endStep,
  text:function(){
    markEnd("end_return");
    var why = P.flags.wroteAruo
      ? "你没有写下自己。你只写了两个字：阿箬。"
      : "你把名字念了出来。";
    var aru = P.flags.wroteAruo
      ? "她走的时候，往门外回头，很认真地对你说了三个字——那是你的名字。只要她还记得，你就没有真正消失。"
      : (P.flags.aruFree
        ? "阿箬站在村口看着你走。她手里有鞋，有陀螺。她张了张嘴，好像要叫你，可她也没有你的名字了。"
        : "井口浮起一层水，水里映着一个转陀螺的孩子。她抬头看了你一眼，又低下头去。");
    return "!!结局 · 无名\n\n"+
    "# 无 名\n\n"+
    why + "\n\n"+
    "念完（写完）之后，四下里静极了。然后是很长的一觉——没有梦，没有声音，像掉进一层温水。\n\n"+
    aru + "\n\n"+
    "你醒来的时候，躺在一座破庙的门槛上。\n\n"+
    "屋梁上挂着半截蛛网，网里裹着一只死去的飞蛾。香案倒了，泥塑的神像少了半张脸。\n\n"+
    "你坐起来，摸了摸胸口——什么都没有。\n\n"+
    "你想不起来自己要去哪儿，也想不起来自己是谁。你只记得，山里有一个村子；村里的灯笼，红得像有人把整面墙浸进了血里。\n\n"+
    "你站起来，往山里走。你走得很稳。你想，总要去看一眼的。\n\n"+
    "!!（你活下来了，代价是你不再是你。）";
  },
  choices:[
    { text:"回到破庙，从头再走一遍", to:backToStart },
    { text:"查看我为这一村做的事", to:function(){ showStatus(); return P.node; } }
  ]
};

SCENES.end_walk = {
  title:"终 · 雾 中",
  ending:true,
  enter:endStep,
  text:function(){
    markEnd("end_walk");
    return "!!结局 · 雾中\n\n"+
    "# 雾 中\n\n"+
    "你没有写，也没有点灯。你只是走出了祠堂，走出了村口。\n\n"+
    "你在山下的镇子里活了很多年，别人叫你「老灯」。\n\n"+
    "你娶了一个寡妇，养了两个不是你的孩子。你从来不说梦话——你怕自己说了什么，会把他们也带进山里去。\n\n"+
    "六十岁那年，你得了病，躺了三个月。临走那天夜里，你忽然能说话了，你抓着床边人的手，想说一个名字。\n\n"+
    "你张着嘴，说了很久。\n\n"+
    "屋里的人听着，只听见几个很轻的音：「……灯下……有人……」\n\n"+
    "你走的时候，窗外起了雾。雾一直往山上爬。\n\n"+
    "!!（你没有解决任何事，可你活成了一个普通人。）";
  },
  choices:[
    { text:"回到破庙，从头再走一遍", to:backToStart },
    { text:"查看我为这一村做的事", to:function(){ showStatus(); return P.node; } }
  ]
};

SCENES.end_free = {
  title:"终 · 出 村",
  ending:true,
  enter:endStep,
  text:function(){
    markEnd("end_free");
    var line1 = P.flags.villageNamed
      ? "村子有了名字：麓。有名字的地方，就有人找得到，也有人回得来。"
      : (P.flags.litVillageLamp
        ? "你把灯留在了井口。那盏灯现在还亮着，暖的，像灶火。你走的时候，替你守着村子的是一盏灶火，不是一盏鬼火。"
        : (P.flags.flippedAll
          ? "祠堂里三百零一块牌位，背面都留着他们自己的一句话。他们是人了，不再是牌位。"
          : (P.flags.knowRule
            ? "你没有改写村志，可你把规矩看清楚了。从今往后，守灯的人是自愿的——这在三百一十年里是头一回。"
            : "村里那一晚的灯笼，熄得干干净净，没有一盏留到天亮。")));
    var line2 = P.flags.aruFree
      ? "阿箬在你前面走着。她走得不快，时不时回头看你一眼，怕你落下。她的鞋在脚上，陀螺揣在怀里。她还没有名字用——她说，等走到有人的地方，她要自己起一个。"
      : "你一个人走出山口。身后的雾没有跟上来。";
    return "!!结局 · 出村\n\n"+
    "# 出 村\n\n"+
    "你走出山口的时候，天刚亮。\n\n"+
    "雾停在村子那一侧，像有人在山口拉了一道帘子。你回头看，只看见一片很普通的山，山脚下有几点极淡的红，天一亮就没了。\n\n"+
    line1 + "\n\n"+
    line2 + "\n\n"+
    "你走下坡的时候，忽然发现自己记得自己的名字了。\n\n"+
    "你没有说出来。你只是把它含在嘴里，一路含着，走到镇上，走到有人烟的地方。\n\n"+
    "!!（你把一个村子，从灯下还给了白天。）";
  },
  choices:[
    { text:"回到破庙，从头再走一遍", to:backToStart },
    { text:"查看我为这一村做的事", to:function(){ showStatus(); return P.node; } }
  ]
};

/* ---------------- 启动 ---------------- */
renderHud();
goto("prologue");
if(!Object.keys(P.endings).length){
  setTimeout(showAbout, 500);
}

})();
</script>
